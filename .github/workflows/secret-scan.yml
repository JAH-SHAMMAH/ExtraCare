# Blocks a secret from reaching the repository.
#
# With the repository private this is the only automated guard GitHub gives us
# either: secret scanning and push protection are free on PUBLIC repositories but
# need Advanced Security on a private one. So this job and the local hook are it.
#
# ~~~ THE BINARY, NOT THE ACTION ~~~
# `gitleaks/gitleaks-action` wants GITLEAKS_LICENSE for organisation accounts and
# pins behaviour we cannot read. The binary is downloaded at a pinned version,
# CHECKSUM-VERIFIED against the vendor's published checksums file, and run
# directly -- so what runs here is exactly what can be run locally.
#
# ~~~ NO BYPASS ~~~
# No `continue-on-error`, no skippable `if:`, no softening input. Three further
# holes are closed on purpose:
#   * a `.gitleaksignore` file FAILS the job -- otherwise a finding could be
#     exempted by appending a line to it;
#   * an inline `gitleaks:allow` comment FAILS the job, same reason;
#   * it runs on `push` AND `pull_request`, so nothing can be slipped onto a
#     branch and merged without the scan having seen it.
# A genuine false positive is fixed by correcting the detector in
# `.gitleaks.toml`, in a commit someone reviews.
#
# ~~~ WHY IT DOES NOT SCAN ALL HISTORY ~~~
# Measured, not assumed: a full-history scan of this repository reports **111
# findings** across 412 commits -- 103 connection strings, 7 assigned literals,
# 1 Stripe-shaped docstring example. They are the 2026-08-23 incident, and they
# are immutable: nothing but a history rewrite removes them.
#
# A gate that is red on every run forever is a gate someone switches off. So the
# gate is: THE WORKING TREE as it stands, plus THE COMMITS THIS PUSH OR PR ADDS.
# That catches everything new, which is the whole job, while the historic
# findings are handled where they actually can be -- by ROTATION, which is the
# only thing that makes a published credential harmless.
#
# `history-report` below still scans everything, on purpose, and never fails the
# build. It is there so the number cannot quietly grow unnoticed.
name: secret-scan

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# RUNNER PINNED. GitHub's annotation on the first run of this workflow warned
# that `ubuntu-latest` migrates to Ubuntu 26 on 2026-10-19. A gate that changes
# image on a date nobody chose is a gate that breaks during a go-live; bump this
# deliberately, in a commit someone reviews.
env:
  # v8.30.1, and the sha256 of gitleaks_8.30.1_linux_x64.tar.gz taken from the
  # release's own `gitleaks_8.30.1_checksums.txt`. Verified by downloading the
  # windows build and matching its published hash before pinning this one.
  # An unverified download in a security job is not a security job.
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  secret-scan:
    name: no new secrets
    runs-on: ubuntu-24.04
    steps:
      - name: Check out with history
        uses: actions/checkout@v4
        with:
          # Needed so the push/PR commit range below resolves. A shallow clone
          # would silently scan nothing and pass.
          fetch-depth: 0

      - name: Refuse if a bypass mechanism has been added
        run: |
          set -euo pipefail
          fail=0
          if [ -f .gitleaksignore ]; then
            echo "::error file=.gitleaksignore::This job has no bypass by design."
            echo "Fix a false positive by correcting .gitleaks.toml in a reviewed commit."
            fail=1
          fi
          # --untracked matters: `git grep` searches only TRACKED files by
          # default, so a bypass comment in a file added but not yet committed
          # would slip past. Verified by planting one in an untracked file.
          if git grep -n -I --untracked -E 'gitleaks:[[:space:]]*allow' -- . ':!.github/workflows/secret-scan.yml' > allow.txt 2>/dev/null; then
            echo "::error::inline gitleaks:allow comment(s) found:"
            cat allow.txt
            fail=1
          fi
          rm -f allow.txt
          exit "$fail"

      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "${base}/${tarball}" -o "$tarball"
          if ! echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -; then
            echo "::error::gitleaks checksum mismatch -- refusing to run an unverified binary."
            echo "If the release was legitimately re-cut, update GITLEAKS_SHA256 from"
            echo "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt in a reviewed commit."
            exit 1
          fi
          tar -xzf "$tarball" gitleaks
          chmod +x gitleaks
          ./gitleaks version

      - name: Prove the scan actually blocks a secret
        # A green scan proves nothing by itself -- a broken detector is also
        # green. This plants a KNOWN FAKE key, asserts the scan goes red, and
        # removes it. Without this step a config error is indistinguishable from
        # a clean repository, which is how a security job rots.
        run: |
          set -euo pipefail
          # The two lines below are AWS's own published documentation example
          # key pair. They grant nothing, and they are here on purpose so the
          # assertion underneath can prove the scan fails on a secret. Both
          # carry an explicit pragma: this is the one exemption in the
          # repository, it is visible on the line, and it is the mechanism
          # working as designed rather than a blanket path skip.
          printf 'aws_access_key_id = AKIAIOSFODNN7EXAMPLE\n' > planted-secret-selftest.txt  # pragma: allowlist-secret
          printf 'AWS_SECRET_ACCESS_KEY = "wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY"\n' >> planted-secret-selftest.txt  # pragma: allowlist-secret
          if ./gitleaks dir . --config .gitleaks.toml --redact --no-banner --exit-code 1; then
            rm -f planted-secret-selftest.txt
            echo "::error::gitleaks did NOT flag a planted AWS key. The scan is not working."
            exit 1
          fi
          rm -f planted-secret-selftest.txt
          echo "self-test passed: a planted key is detected, so a real one would be."

      - name: Scan the working tree
        run: |
          set -euo pipefail
          ./gitleaks dir . \
            --config .gitleaks.toml \
            --redact --no-banner --exit-code 1

      - name: Scan the commits this push or PR adds
        # --redact so a finding never reaches the CI log, which is retained and
        # readable by anyone with repository access.
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="${{ github.event.pull_request.base.sha }}..HEAD"
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ] || [ -z "${{ github.event.before }}" ]; then
            # A brand-new branch has no `before`. Scanning only what this branch
            # adds beyond the default branch keeps it to the author's own work.
            git fetch --no-tags origin "${{ github.event.repository.default_branch }}" || true
            range="origin/${{ github.event.repository.default_branch }}..HEAD"
          else
            range="${{ github.event.before }}..${{ github.sha }}"
          fi
          echo "scanning commit range: $range"
          # An empty range (e.g. a branch already merged) is not a failure.
          if [ -z "$(git rev-list "$range" 2>/dev/null || true)" ]; then
            echo "no new commits in range -- nothing to scan"
            exit 0
          fi
          ./gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --log-opts "$range" \
            --redact --no-banner --exit-code 1

      - name: Run the repository's own scanner
        # Catches what gitleaks does not. MEASURED: a CSV whose header row is
        # `student_id,email,temp_password` is reported CLEAN by gitleaks -- no
        # token-format rule can see a credential-shaped COLUMN -- and that is
        # precisely how 450 passwords were committed on 2026-08-23. This step is
        # the one that would have stopped it.
        run: python3 tools/scan_secrets.py --tree

  history-report:
    name: historic findings (reported, never fails)
    runs-on: ubuntu-24.04
    # Deliberately cannot fail the build: the historic findings are immutable
    # without a rewrite, and a permanently-red check gets switched off. This
    # exists so the NUMBER is visible and cannot creep up unnoticed.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "${base}/${tarball}" -o "$tarball"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" gitleaks && chmod +x gitleaks
      - name: Count findings across all history
        run: |
          set -euo pipefail
          ./gitleaks detect --source . --config .gitleaks.toml \
            --redact --no-banner --exit-code 0 \
            --report-format json --report-path history.json || true
          n=$(python3 -c "import json;print(len(json.load(open('history.json'))))" 2>/dev/null || echo "?")
          echo "### Historic secret findings: $n" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Baseline at the time of writing: **111** (103 connection strings," >> "$GITHUB_STEP_SUMMARY"
          echo "7 assigned literals, 1 docstring example). These are the" >> "$GITHUB_STEP_SUMMARY"
          echo "2026-08-23 incident and are immutable without a history rewrite." >> "$GITHUB_STEP_SUMMARY"
          echo "They are addressed by ROTATION, not by deletion." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "If this number is ABOVE 111, something new has been added." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gitleaks-history-report
          path: history.json
          if-no-files-found: ignore
